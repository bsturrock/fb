<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tackle Lab</title>
    <style>
      :root {
        --bg: #101418;
        --panel: #182028ee;
        --text: #dfe6ec;
        --muted: #8a99a6;
        --accent: #f2c14e;
        --bad: #ff5d5d;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #view {
        position: absolute;
        inset: 0;
      }
      #ui {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 400px;
        max-height: calc(100% - 16px);
        overflow: auto;
        background: var(--panel);
        border-radius: 6px;
        padding: 8px;
        box-sizing: border-box;
      }
      #ui select,
      #ui button {
        font: inherit;
        background: #24303b;
        color: var(--text);
        border: 1px solid #3a4a58;
        border-radius: 4px;
        padding: 3px 6px;
        margin: 2px 2px 2px 0;
      }
      #ui button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      #ui select#fixture {
        width: 100%;
      }
      #ui input#filter {
        flex: 1;
        min-width: 120px;
        font: inherit;
        background: #24303b;
        color: var(--text);
        border: 1px solid #3a4a58;
        border-radius: 4px;
        padding: 3px 6px;
        margin: 2px 2px 2px 0;
      }
      #listRow label {
        margin: 0 0 0 4px;
        white-space: nowrap;
        cursor: pointer;
      }
      #allFixtures {
        vertical-align: middle;
        margin: 0 2px 0 0;
      }
      #scrub {
        flex: 1;
        min-width: 120px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        margin: 4px 0;
      }
      .row label {
        color: var(--muted);
        margin-right: 4px;
      }
      #tune,
      #jog,
      #brake {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        margin-top: 6px;
      }
      #tune[hidden],
      #jog[hidden],
      #brake[hidden] {
        display: none;
      }
      #tuneRows input[type='range'],
      #jogRows input[type='range'],
      #brakeRows input[type='range'] {
        width: 180px;
        vertical-align: middle;
      }
      #tuneOut,
      #jogOut,
      #brakeOut {
        font-size: 11px;
        user-select: all;
      }
      #runlab {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        margin-top: 6px;
        border-top: 1px solid #3a4a58;
        padding-top: 4px;
      }
      #runlab[hidden],
      #rlError[hidden] {
        display: none;
      }
      #runlab > label {
        color: var(--accent);
      }
      #rlSpeed {
        width: 130px;
      }
      #rlRows input[type='range'] {
        width: 150px;
        vertical-align: middle;
      }
      #rlFrames {
        display: flex;
        flex-wrap: wrap;
        gap: 1px;
      }
      #ui #rlFrames button {
        min-width: 21px;
        padding: 2px 2px;
        margin: 0;
        position: relative;
      }
      #ui #rlFrames button.stL {
        background: #234d6b;
      }
      #ui #rlFrames button.stR {
        background: #6b4423;
      }
      #ui #rlFrames button.stL.stR {
        background: linear-gradient(90deg, #234d6b 50%, #6b4423 50%);
      }
      #ui #rlFrames button.on {
        border-color: var(--accent);
        color: var(--accent);
      }
      #ui #rlFrames button.cur {
        outline: 2px solid #ffffff;
        outline-offset: -2px;
      }
      #ui #rlFrames button.ed::after {
        content: '';
        position: absolute;
        top: 1px;
        right: 1px;
        width: 4px;
        height: 4px;
        border-radius: 2px;
        background: #ff7a45;
      }
      #rlLive,
      #rlAnalysis,
      #rlStatus,
      #rlError {
        font-size: 11px;
        white-space: pre-wrap;
      }
      #rlStatus,
      #rlKey {
        color: var(--muted);
        font-size: 11px;
      }
      #info {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 6px 0 0;
        font-size: 11px;
      }
      #title {
        color: var(--accent);
        margin: 4px 0;
        white-space: normal;
      }
      .bad {
        color: var(--bad);
      }
      .tag {
        font: 11px/1.2 ui-monospace, Menlo, monospace;
        color: #fff;
        background: #000a;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: pre;
        pointer-events: none;
      }
      .tag.bal {
        font-size: 10px;
        background: #0009;
        color: #c8ffd0;
      }
      .tag.bal.falling {
        color: #ff9a9a;
      }
      .tag.arm {
        font-size: 10px;
        background: #0008;
        color: #ffe9a8;
      }
      @media (max-width: 600px) {
        #ui {
          width: calc(100% - 16px);
          max-height: 45%;
        }
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="ui">
      <div class="row" id="listRow">
        <input id="filter" type="search" placeholder="filter" title="Narrow the list by name, id or title. Enter loads the first match; Esc clears." autocomplete="off" spellcheck="false" />
        <label for="allFixtures"><input id="allFixtures" type="checkbox" /> <span id="allLabel">All fixtures</span></label>
      </div>
      <select id="fixture"></select>
      <div id="title"></div>
      <div class="row">
        <button id="run">Run</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
        <label for="speed">speed</label>
        <select id="speed">
          <option value="0.1">0.1×</option>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div class="row">
        <label for="scrub">time</label>
        <input id="scrub" type="range" min="0" max="0" step="1" value="0" />
        <span id="scrubOut"></span>
      </div>
      <div class="row">
        <label>camera</label>
        <button data-cam="side">side</button>
        <button data-cam="front">front</button>
        <button data-cam="oblique">oblique</button>
        <button data-cam="overhead">overhead</button>
        <button id="follow" class="on">follow</button>
      </div>
      <div class="row">
        <label>show</label>
        <button id="ovl" class="on">overlays</button>
        <button id="col">colliders</button>
        <button id="prim" title="diagnostic primitive bodies instead of the supplied model">primitives</button>
        <button id="palette">palette</button>
        <button id="export">export JSON</button>
      </div>
      <div id="tune" class="row" hidden>
        <label>stance width (m per foot, outward)</label>
        <div id="tuneRows"></div>
        <div class="row">
          <code id="tuneOut"></code>
          <button id="tuneCopy">copy</button>
          <button id="tuneZero">reset to clip</button>
        </div>
      </div>
      <div id="jog" class="row" hidden>
        <label>jog (Fast Run below its slowest cadence: stride share, lift = share ^ liftScale)</label>
        <div id="jogRows"></div>
        <div class="row">
          <code id="jogOut"></code>
          <button id="jogCopy">copy</button>
          <button id="jogReset">reset</button>
        </div>
      </div>
      <div id="brake" class="row" hidden>
        <label>braking stance (physical root height while braking)</label>
        <div id="brakeRows"></div>
        <div class="row">
          <code id="brakeOut"></code>
          <button id="brakeCopy">copy</button>
          <button id="brakeReset">reset to profile</button>
        </div>
      </div>
      <div id="runlab" class="row" hidden>
        <label>run lab: live speed and Fast Run keyframes</label>
        <div class="row">
          <label for="rlSpeed">speed</label>
          <input id="rlSpeed" type="range" min="0" max="6.6" step="0.1" value="5" />
          <span id="rlSpeedOut"></span>
          <label for="rlBall"><input id="rlBall" type="checkbox" /> ball</label>
          <label for="rlGhost"><input id="rlGhost" type="checkbox" checked /> ghost</label>
        </div>
        <div id="rlLive"></div>
        <div class="row">
          <label>frame</label>
          <button id="rlPrev" title="previous frame">‹</button>
          <button id="rlNext" title="next frame">›</button>
          <span id="rlFrameInfo"></span>
        </div>
        <div id="rlFrames"></div>
        <div id="rlKey">blue: left foot down · brown: right foot down · white ring: runner's frame now · dot: edited</div>
        <div class="row">
          <label for="rlJoint">joint</label>
          <select id="rlJoint"></select>
          <label for="rlSpread">spread</label>
          <select id="rlSpread">
            <option value="0">this frame</option>
            <option value="1" selected>±1 frame</option>
            <option value="2">±2 frames</option>
          </select>
        </div>
        <div id="rlRows"></div>
        <div id="rlError" class="bad" hidden></div>
        <div id="rlAnalysis"></div>
        <div class="row">
          <button id="rlUndo">undo</button>
          <button id="rlResetFrame">reset frame</button>
          <button id="rlResetAll">reset all</button>
          <button id="rlSave" title="write models/animations/fast-run.edits.json">save</button>
          <button id="rlCopy" title="copy the edits file text">copy</button>
        </div>
        <div id="rlStatus"></div>
      </div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
